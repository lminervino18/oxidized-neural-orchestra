[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "orchestra"
version = "0.1.0"

[project.optional-dependencies]
bench = ["numpy", "torch", "safetensors"]
dev = ["ruff"]

[tool.maturin]
python-packages = ["orchestra"]
module-name = "orchestra._orchestra"

[lints]
workspace = true
